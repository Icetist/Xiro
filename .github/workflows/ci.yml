name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the display driver package (pinned, checksum verified)
        run: powershell -File scripts/fetch-driver.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build
        run: cargo build --release --workspace

      - name: Test with coverage
        shell: pwsh
        run: |
          cargo llvm-cov --workspace --no-fail-fast --summary-only --fail-under-lines 60 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          # Failures as annotations, readable without signing in.
          if ($code -ne 0) { Select-String -Path test.log -Pattern 'panicked at|^error|FAILED|assertion' | Select-Object -First 30 | ForEach-Object { "::error::$($_.Line)" } }
          exit $code

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Client tests
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: Xiro
          path: target/release/xiro.exe
