# On a v* tag: builds Xiro.exe, signs it via SignPath and publishes it with its SHA-256. Actions are pinned to commits.
# Unsigned until secret SIGNPATH_API_TOKEN and variables SIGNPATH_{ORGANIZATION_ID,PROJECT_SLUG,SIGNING_POLICY_SLUG} are set (docs/code-signing.md).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release
  actions: read   # SignPath reads this run's artifact

jobs:
  release:
    runs-on: windows-latest
    # Settings → Environments → release: add yourself as a required reviewer to approve
    # each release before it is built and signed.
    environment: release
    env:
      # A release exe must carry its product name and version (required for signing).
      XIRO_REQUIRE_VERSION_INFO: '1'
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Only released code from the main branch, at the version in Cargo.toml
        id: version
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "$env:TAG is not on $env:DEFAULT_BRANCH" }
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'xiro').version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match version $version in Cargo.toml" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Fetch the display driver package (pinned, checksum verified)
        run: powershell -File scripts/fetch-driver.ps1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Test
        run: cargo test --workspace

      - name: Build
        shell: pwsh
        run: |
          cargo build --release -p xiro
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/xiro.exe out/Xiro.exe

      - name: Upload the unsigned build
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Xiro-unsigned
          path: out/Xiro.exe

      - name: Sign with SignPath Foundation
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Use the signed exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature signed/Xiro.exe
          if ($signature.Status -ne 'Valid') { throw "The signed exe does not verify: $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw "Unexpected signer: $($signature.SignerCertificate.Subject)" }
          Copy-Item signed/Xiro.exe out/Xiro.exe -Force

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/Xiro.exe -Algorithm SHA256).Hash
          "$hash  Xiro.exe" | Out-File -Encoding ascii out/Xiro.exe.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/Xiro.exe
            out/Xiro.exe.sha256
          generate_release_notes: true
