[package]
name = "xiro-shell"
description = "Windows shell integration for Xiro: tray icon, the Direct2D window and dialogs, firewall rule and clean-up."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qrcodegen = "1.8.0"
windows-numerics = "0.3.1"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# The demo example screenshots the pairing window with PrintWindow (lives in Storage_Xps).
[dev-dependencies.windows]
workspace = true
features = ["Win32_Storage_Xps"]
