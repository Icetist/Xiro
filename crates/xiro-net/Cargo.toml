[package]
name = "xiro-net"
description = "Local CA, server certificates and the TLS acceptor for Xiro's HTTPS server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust crypto only: the Windows GNU toolchain here has no C compiler, so
# ring / aws-lc-rs / openssl are out. TLS itself is the OS's SChannel.
# These are the stable RustCrypto line (rsa 0.9 / x509-cert 0.2 / der 0.7);
# x509-cert 0.3 pairs with rsa 0.10, which is still a release candidate.
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["pem", "std"] }
native-tls = "0.2.18"
pkcs1 = { version = "0.7", features = ["pem", "std"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spki = { version = "0.7", features = ["std"] }
tokio-native-tls = "0.3.1"
# "hazmat" unlocks Profile::Manual, so every extension (and its criticality)
# is spelled out here exactly as certs.js did rather than left to defaults.
x509-cert = { version = "0.2", features = ["builder", "hazmat", "pem", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
