[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
windows = "0.62.2"
windows-core = "0.62.2"
xiro-video = { path = "crates/xiro-video" }

[package]
name = "xiro"
description = "Use an iPad as a low-latency second monitor for Windows. No iPad app, no account: just Safari."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
qrcodegen = "1.8.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
xiro-display = { version = "0.0.1", path = "crates/xiro-display" }
xiro-input = { version = "0.0.1", path = "crates/xiro-input" }
xiro-net = { version = "0.0.1", path = "crates/xiro-net" }
xiro-video.workspace = true
windows-core.workspace = true
tokio-native-tls = "0.3.1"
xiro-shell = { version = "0.0.1", path = "crates/xiro-shell" }
xiro-hotspot = { version = "0.0.1", path = "crates/xiro-hotspot" }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"

[build-dependencies]
winresource = "0.1.34"
